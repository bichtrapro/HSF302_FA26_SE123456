<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Chi tiết sinh viên</title>
</head>
<body>
<section>
    <div class="mb-4">
        <a th:href="@{/students}" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-1"></i>Quay lại
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0"><i class="bi bi-person-vcard me-2"></i>Chi tiết sinh viên</h3>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-3 fw-semibold text-muted">ID:</div>
                <div class="col-md-9" th:text="${student.id}">1</div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3 fw-semibold text-muted">Họ tên:</div>
                <div class="col-md-9" th:text="${student.name}">Tên sinh viên</div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3 fw-semibold text-muted">Email:</div>
                <div class="col-md-9">
                    <a th:href="@{'mailto:' + student.email}" th:text="${student.email}">email@example.com</a>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3 fw-semibold text-muted">Tuổi:</div>
                <div class="col-md-9" th:text="${student.age}">20</div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3 fw-semibold text-muted">Chuyên ngành:</div>
                <div class="col-md-9">
                    <span class="badge bg-secondary" th:text="${student.major}">CNTT</span>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3 fw-semibold text-muted">GPA:</div>
                <div class="col-md-9">
                    <span th:classappend="${student.gpa >= 3.5} ? 'gpa-high' :
                                         (${student.gpa >= 2.5} ? 'gpa-mid' : 'gpa-low')"
                          th:text="${#numbers.formatDecimal(student.gpa, 1, 1)}">3.5</span>
                </div>
            </div>
        </div>
        <div class="card-footer bg-light d-flex gap-2">
            <a th:href="@{/students/{id}/edit(id=${student.id})}" class="btn btn-primary">
                <i class="bi bi-pencil me-1"></i>Sửa
            </a>
            <form th:action="@{/students/{id}/delete(id=${student.id})}"
                  method="post" class="d-inline"
                  th:data-name="${student.name}"
                  onsubmit="return confirm('Xóa sinh viên ' + this.dataset.name + '?')">
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash me-1"></i>Xóa
                </button>
            </form>
        </div>
    </div>
</section>
</body>
</html>
